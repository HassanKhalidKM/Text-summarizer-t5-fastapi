name: Docker CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t text-summarizer .

      - name: Verify app code compiles inside image
        run: docker run --rm text-summarizer python -m py_compile app.py

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image
        run: |
          docker tag text-summarizer ghcr.io/${{ github.actor }}/text-summarizer:latest
          docker push ghcr.io/${{ github.actor }}/text-summarizer:latest