name: Docker CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t text-summarizer .

      - name: Verify app code compiles inside image
        run: docker run --rm text-summarizer python -m py_compile app.py