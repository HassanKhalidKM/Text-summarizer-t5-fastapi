name: Docker CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t text-summarizer .

      - name: Run container smoke test
        run: |
          docker run -d -p 8000:8000 --name test-container text-summarizer
          sleep 15
          curl -f http://localhost:8000/ || exit 1
          docker stop test-container